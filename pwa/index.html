<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StageLine">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>StageLine — Concert Lyrics</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #0E0E12;
      --surface-2: #15151C;
      --active: #121216;
      --border: #22222A;
      --text: #E2E2E6;
      --sub: #8E8E93;
      --tr: #7A7A80;
      --gold: #FFD166;
      --gold-bg: #1B170C;
      --danger: #FF6B6B;
      --lyric-size: 23px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }
    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }
    .screen.active {
      display: flex;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(12px + var(--safe-top)) 16px 10px;
      background: var(--bg);
      border-bottom: 1px solid #16161C;
      flex-shrink: 0;
    }
    .topbar-title {
      flex: 1;
      min-width: 0;
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-title .sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-dot {
      color: var(--gold);
      margin-right: 6px;
    }
    .icon-btn {
      min-width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 0 10px;
      flex-shrink: 0;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.95);
      opacity: 0.78;
    }
    .icon-btn.gold {
      background: var(--gold);
      color: #000000;
      border-color: var(--gold);
      font-weight: 700;
    }
    .icon-btn.active-toggle {
      background: var(--gold-bg);
      color: var(--gold);
      border-color: rgba(255, 209, 102, 0.55);
    }
    .icon-btn.danger {
      color: var(--danger);
    }
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px calc(92px + var(--safe-bottom));
    }

    /* Search Bar & Predictive Autocomplete */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 10px 0 12px;
      height: 42px;
    }
    .search-box:focus-within {
      border-color: var(--gold);
    }
    .search-icon {
      color: var(--sub);
      font-size: 14px;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--text);
    }
    .search-input::placeholder {
      color: var(--sub);
    }
    .search-clear {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--sub);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .suggest-list {
      margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .suggest-item {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #181820;
    }
    .suggest-item:last-child {
      border-bottom: none;
    }
    .suggest-item:active {
      background: var(--surface-2);
    }
    .suggest-main {
      flex: 1;
      min-width: 0;
    }
    .suggest-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggest-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggest-play {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .hl {
      color: var(--gold);
      font-weight: 800;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--sub);
    }
    .status-badge {
      color: var(--gold);
      font-weight: 600;
    }

    /* Home Setlist Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.14s ease;
    }
    .card:active {
      transform: scale(0.985);
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 4px;
    }

    /* Music-App Style 2-Column Song Grid */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .song-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      contain: layout style;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.14s ease;
    }
    .song-tile:active {
      transform: scale(0.965);
      border-color: var(--gold);
    }
    .tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tile-num {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      background: var(--active);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #1C1C24;
    }
    .tile-gold-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      display: inline-block;
    }
    .tile-more {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      color: var(--sub);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tile-more:active {
      background: var(--surface-2);
      color: var(--text);
    }
    .tile-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-artist {
      font-size: 12px;
      color: var(--sub);
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
    }
    .empty h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .empty p {
      margin: 0 0 22px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.5;
    }
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
      margin: 0 auto;
    }
    .btn-primary {
      background: var(--gold);
      color: #000000;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
    }
    .fab {
      position: fixed;
      right: 18px;
      bottom: calc(18px + var(--safe-bottom));
      background: var(--gold);
      color: #000000;
      font-weight: 800;
      font-size: 15px;
      padding: 13px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    /* Action Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 80;
    }
    .sheet-backdrop.open {
      display: flex;
    }
    .sheet-panel {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 14px 16px calc(18px + var(--safe-bottom));
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px;
      padding: 0 4px;
      color: var(--gold);
    }
    .sheet-btn {
      width: 100%;
      text-align: left;
      padding: 13px 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: block;
    }
    .sheet-btn:active {
      background: var(--surface-2);
    }
    .sheet-btn.danger {
      color: var(--danger);
    }

    /* Editor */
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--sub);
      margin: 12px 0 6px;
      font-weight: 600;
    }
    .input, .textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .input:focus, .textarea:focus {
      border-color: var(--gold);
    }
    .textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.5;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--active);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
    }
    .chip.gold {
      color: var(--gold);
      border-color: rgba(255, 209, 102, 0.45);
    }

    /* CONCERT MODE — 60fps Spotify-Style GPU-Composited Lyrics */
    #screen-concert {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .concert-hud-top {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: calc(10px + var(--safe-top)) 12px 8px;
      background: var(--bg);
      border-bottom: 1px solid #141418;
      flex-shrink: 0;
    }
    .section-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 12px;
      background: var(--bg);
      border-bottom: 1px solid #141418;
      flex-shrink: 0;
    }
    .section-pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      flex-shrink: 0;
      transition: transform 0.16s ease;
    }
    .pill.sing {
      color: var(--gold);
      border-color: rgba(255, 209, 102, 0.35);
    }
    .pill.current {
      background: var(--gold);
      color: #000000;
      border-color: var(--gold);
      transform: scale(1.04);
    }
    .lyrics-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .lyrics-scroller {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 26vh 18px 54vh;
      will-change: scroll-position;
    }
    .lyrics-track {
      will-change: transform, opacity;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
    }
    .lyrics-track.hide-tr .lyric-tr {
      display: none;
    }
    .section-header {
      margin: 26px 0 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--sub);
      opacity: 0.55;
    }
    .section-header.sing {
      color: var(--gold);
      opacity: 0.85;
    }
    .lyric-line {
      position: relative;
      padding: 9px 12px 9px 16px;
      margin: 5px 0;
      border-radius: 12px;
      font-size: var(--lyric-size);
      font-weight: 700;
      line-height: 1.36;
      color: var(--text);
      transform-origin: left center;
      transform: translate3d(0, 0, 0) scale(0.985);
      opacity: 0.36;
      contain: layout style;
      will-change: transform, opacity;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .lyric-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 3px;
      background: var(--text);
      transform: scaleY(0);
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
    }
    .lyric-line.sing {
      color: var(--gold);
    }
    .lyric-line.sing::before {
      background: var(--gold);
    }
    .lyric-line.is-past {
      transform: translate3d(0, 0, 0) scale(0.975);
      opacity: 0.26;
    }
    .lyric-line.is-next {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 0.66;
    }
    .lyric-line.is-far {
      transform: translate3d(0, 0, 0) scale(0.98);
      opacity: 0.36;
    }
    .lyric-line.is-active {
      transform: translate3d(6px, 0, 0) scale(1.045);
      opacity: 1;
      background: var(--active);
    }
    .lyric-line.sing.is-active {
      background: var(--gold-bg);
    }
    .lyric-line.is-active::before {
      transform: scaleY(1);
      opacity: 1;
    }
    .lyric-tr {
      margin-top: 4px;
      font-size: 0.68em;
      font-weight: 500;
      color: var(--tr);
    }
    .concert-hud-bottom {
      padding: 10px 14px calc(12px + var(--safe-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }
    .hud-row:last-child { margin-bottom: 0; }
    .dim-slider {
      flex: 1;
      accent-color: var(--gold);
    }
    .dim-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 90;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(26px + var(--safe-bottom));
      transform: translateX(-50%);
      background: #1C1C22;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 100;
      max-width: 90vw;
      text-align: center;
      display: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen active">
    <header class="topbar">
      <div class="topbar-title">
        <h1><span class="brand-dot">●</span>StageLine</h1>
      </div>
      <button class="icon-btn" id="btn-import">Nhập tệp</button>
      <button class="icon-btn" id="btn-seed-atvncg">ATVNCG</button>
    </header>
    <div class="scroll-area">
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="home-search" class="search-input" type="search" autocomplete="off" placeholder="Tìm nhanh tên bài hát, nghệ sĩ...">
          <button id="home-search-clear" class="search-clear hidden">✕</button>
        </div>
        <div id="home-suggest" class="suggest-list hidden"></div>
      </div>
      <div class="status-bar">
        <span id="offline-status" class="status-badge">Đang lưu offline...</span>
        <span id="net-status"></span>
      </div>
      <div id="setlist-list"></div>
    </div>
    <button class="fab" id="btn-new-setlist">+ Tạo Setlist</button>
    <input type="file" id="file-input" accept=".concert,.json,.lrc,.txt,*/*" class="hidden">
  </section>

  <!-- SETLIST DETAIL SCREEN (MUSIC-APP 2-COL GRID + PREDICTIVE SEARCH) -->
  <section id="screen-detail" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-detail-back">←</button>
      <div class="topbar-title">
        <h1 id="detail-title">Setlist</h1>
        <div class="sub" id="detail-artist"></div>
      </div>
      <button class="icon-btn" id="btn-export">.concert</button>
      <button class="icon-btn gold" id="btn-start-concert">▶</button>
    </header>
    <div class="scroll-area">
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="detail-search" class="search-input" type="search" autocomplete="off" placeholder="Tìm bài trong setlist này...">
          <button id="detail-search-clear" class="search-clear hidden">✕</button>
        </div>
        <div id="detail-suggest" class="suggest-list hidden"></div>
      </div>
      <div id="song-list" class="song-grid"></div>
    </div>
    <button class="fab" id="btn-add-song">+ Thêm bài</button>
  </section>

  <!-- SONG ACTION SHEET -->
  <div id="song-sheet" class="sheet-backdrop">
    <div class="sheet-panel">
      <div id="sheet-song-title" class="sheet-title">Bài hát</div>
      <button class="sheet-btn" id="sheet-play">▶ Mở Concert Mode</button>
      <button class="sheet-btn" id="sheet-edit">✎ Sửa lời bài hát</button>
      <button class="sheet-btn" id="sheet-up">↑ Đẩy lên trước</button>
      <button class="sheet-btn" id="sheet-down">↓ Đẩy xuống sau</button>
      <button class="sheet-btn danger" id="sheet-delete">✕ Xóa bài khỏi setlist</button>
    </div>
  </div>

  <!-- QUICK LYRICS EDITOR SCREEN -->
  <section id="screen-editor" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-editor-cancel">Hủy</button>
      <div class="topbar-title">
        <h1 id="editor-heading">Sửa lời bài hát</h1>
      </div>
      <button class="icon-btn gold" id="btn-editor-save">Lưu</button>
    </header>
    <div class="scroll-area">
      <label class="field-label" for="ed-title">Tên bài hát</label>
      <input id="ed-title" class="input" placeholder="VD: Hỏa Tâm">
      <label class="field-label" for="ed-artist">Nghệ sĩ / Nhà (tùy chọn)</label>
      <input id="ed-artist" class="input" placeholder="VD: 33 Anh Tài">
      <label class="field-label" for="ed-lyrics">Lời bài hát (hỗ trợ [Chorus], [Sing-along], dòng dịch &gt;)</label>
      <div class="chips" id="tag-chips">
        <button class="chip" data-tag="[Verse 1]">+ [Verse 1]</button>
        <button class="chip" data-tag="[Pre-Chorus]">+ [Pre-Chorus]</button>
        <button class="chip gold" data-tag="[Chorus]">+ [Chorus]</button>
        <button class="chip" data-tag="[Bridge]">+ [Bridge]</button>

  <script>
    (() => {
      const STORAGE_PREFIX = 'stageline:v1:setlist:';
      const SPEEDS = [0.7, 1.0, 1.4, 1.8];
      const BASE_AUTOSCROLL_PX_PER_SEC = 28;

      const state = {
        setlists: [],
        currentSetlistId: null,
        editingSongIndex: -1,
        sheetSongIndex: -1,
        concertSetlist: null,
        concertSongIdx: 0,
        activeLineIdx: 0,
        fontSize: 23,
        showTr: true,
        hudVisible: true,
        wakeLock: null,
        scrollRaf: 0,
        autoScrollOn: false,
        autoScrollRaf: 0,
        autoScrollLastTs: 0,
        speedIdx: 1,
        lineEls: [],
        sectionStarts: [],
      };

      const $ = (id) => document.getElementById(id);

      // Register Offline-First Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          const markReady = () => {
            $('offline-status').textContent = '✓ Sẵn sàng Offline (Chế độ máy bay OK)';
          };
          if (navigator.serviceWorker.controller || reg.active) {
            markReady();
          } else {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'activated') markReady();
              });
            });
          }
        }).catch(() => {
          $('offline-status').textContent = 'Lưu offline cục bộ trong Safari';
        });
      }

      const updateNetStatus = () => {
        $('net-status').textContent = navigator.onLine ? 'Online' : 'Offline Mode';
      };
      window.addEventListener('online', updateNetStatus);
      window.addEventListener('offline', updateNetStatus);
      updateNetStatus();

      function showToast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(el._t);
        el._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
      }

      function showScreen(id) {
        document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
        $(id).classList.add('active');
        if (id !== 'screen-concert') {
          stopAutoScroll();
          cancelSmoothScroll();
          releaseWakeLock();
        }
      }

      // Vietnamese diacritic-insensitive search helpers
      function normText(str) {
        return (str || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/g, 'd')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function highlightMatch(raw, query) {
        const nq = normText(query);
        if (!nq) return escapeHtml(raw);
        const chars = Array.from(raw);
        let normStr = '';
        const map = [];
        for (let i = 0; i < chars.length; i++) {
          const piece = normText(chars[i]);
          for (let j = 0; j < piece.length; j++) {
            normStr += piece[j];
            map.push(i);
          }
        }
        const idx = normStr.indexOf(nq);
        if (idx < 0) return escapeHtml(raw);
        const start = map[idx];
        const end = map[Math.min(idx + nq.length - 1, map.length - 1)] + 1;
        return escapeHtml(chars.slice(0, start).join('')) +
          `<span class="hl">${escapeHtml(chars.slice(start, end).join(''))}</span>` +
          escapeHtml(chars.slice(end).join(''));
      }

      function searchSongs(query, scopeSetlist) {
        const q = normText(query);
        if (!q) return [];
        const pools = scopeSetlist ? [scopeSetlist] : state.setlists;
        const hits = [];

        pools.forEach((sl) => {
          (sl.songs || []).forEach((song, songIdx) => {
            const nt = normText(song.title);
            const na = normText(song.artist || sl.artist || '');
            let score = 0;
            if (nt.startsWith(q)) score = 100;
            else if (nt.includes(q)) score = 75;
            else if (na.includes(q)) score = 50;
            else {
              const firstLyricMatch = (song.sections || []).some((sec) =>
                (sec.lines || []).some((l) => normText(l.t).includes(q))
              );
              if (firstLyricMatch) score = 25;
            }
            if (score > 0) {
              hits.push({ score, setlist: sl, song, songIdx });
            }
          });
        });

        hits.sort((a, b) => b.score - a.score || a.song.title.localeCompare(b.song.title));
        return hits.slice(0, 6);
      }

      function renderSuggestions(listEl, hits, query, showSetlistName) {
        if (!query.trim()) {
          listEl.classList.add('hidden');
          listEl.innerHTML = '';
          return;
        }
        if (!hits.length) {
          listEl.innerHTML = '<div class="suggest-item"><div class="suggest-sub">Không tìm thấy bài hát phù hợp</div></div>';
          listEl.classList.remove('hidden');
          return;
        }
        listEl.innerHTML = '';
        hits.forEach((hit) => {
          const btn = document.createElement('button');
          btn.className = 'suggest-item';
          const artist = hit.song.artist || hit.setlist.artist || '';
          const subText = showSetlistName
            ? [artist, hit.setlist.setlist].filter(Boolean).join(' • ')
            : (artist || `${(hit.song.sections || []).length} đoạn`);
          btn.innerHTML = `
            <div class="suggest-main">
              <div class="suggest-title">${highlightMatch(hit.song.title, query)}</div>
              <div class="suggest-sub">${highlightMatch(subText, query)}</div>
            </div>
            <span class="suggest-play">▶ Hát</span>`;
          btn.onclick = () => {
            listEl.classList.add('hidden');
            state.currentSetlistId = hit.setlist.id;
            openConcert(hit.setlist, hit.songIdx);
          };
          listEl.appendChild(btn);
        });
        listEl.classList.remove('hidden');
      }

      // Storage (.concert v1 compatible)
      function loadSetlists() {
        const out = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(STORAGE_PREFIX)) continue;
          try {
            const obj = JSON.parse(localStorage.getItem(k));
            if (obj && obj.v === 1 && Array.isArray(obj.songs)) out.push(obj);
          } catch (_) {}
        }
        out.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
        state.setlists = out;
      }

      function saveSetlist(setlist) {
        setlist.v = 1;
        setlist.updatedAt = new Date().toISOString();
        const safeId = (setlist.id || ('sl-' + Date.now().toString(36))).replace(/[^a-zA-Z0-9._-]/g, '_');
        setlist.id = safeId;
        localStorage.setItem(STORAGE_PREFIX + safeId, JSON.stringify(setlist));
        loadSetlists();
      }

      function deleteSetlist(id) {
        localStorage.removeItem(STORAGE_PREFIX + id);
        loadSetlists();
      }

      // Parser
      function isSingAlongTag(tag) {
        const t = tag.toLowerCase();
        if (t.includes('pre-chorus') || t.includes('pre chorus')) return false;
        return t.includes('chorus') || t.includes('sing-along') || t.includes('sing along') || t.includes('fanchant') || t.includes('điệp khúc');
      }

      function parseLyricsText(raw, fallbackTitle, fallbackArtist) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        let title = fallbackTitle || 'Bài hát mới';
        let artist = fallbackArtist || '';
        const sections = [];
        let current = null;

        const ensureSection = (tag) => {
          current = { tag, singAlong: isSingAlongTag(tag), lines: [] };
          sections.push(current);
        };

        for (let rawLine of lines) {
          let line = rawLine.trim();
          if (!line) continue;
          const ti = line.match(/^\[ti:(.+?)\]$/i);
          if (ti) { title = ti[1].trim(); continue; }
          const ar = line.match(/^\[ar:(.+?)\]$/i);
          if (ar) { artist = ar[1].trim(); continue; }
          if (/^\[(al|by|offset):/i.test(line)) continue;
          line = line.replace(/^\s*(\[\d{1,2}:\d{2}(?:\.\d{1,3})?\])+\s*/, '').trim();
          if (!line) continue;
          const secMatch = line.match(/^\[([^\]]+)\]$/);
          if (secMatch) { ensureSection(secMatch[1].trim()); continue; }
          if ((line.startsWith('>') || line.startsWith('|')) && current && current.lines.length > 0) {
            const tr = line.slice(1).trim();
            if (tr) current.lines[current.lines.length - 1].tr = tr;
            continue;
          }
          if (!current) ensureSection('Verse 1');
          current.lines.push({ t: line });
        }

        const nonEmpty = sections.filter((s) => s.lines.length > 0);
        return {
          id: 'song-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
          title,
          artist: artist || undefined,
          sections: nonEmpty.length ? nonEmpty : [{ tag: 'Verse 1', singAlong: false, lines: [{ t: '(Chưa có lời)' }] }],
        };
      }

      function songToEditableText(song) {
        return (song.sections || []).map((sec) => {
          const body = (sec.lines || []).map((l) => l.tr ? `${l.t}\n> ${l.tr}` : l.t).join('\n');
          return `[${sec.tag}]\n${body}`;
        }).join('\n\n');
      }

      function shortTag(tag) {
        const t = tag.toLowerCase();
        if (t.includes('pre-chorus') || t.includes('pre chorus')) return 'Pre';
        if (t.includes('chorus') || t.includes('điệp khúc')) return 'CHORUS';
        if (t.includes('sing') || t.includes('fanchant')) return 'SING';
        if (t.includes('verse')) {
          const num = tag.match(/\d+/);
          return num ? `V${num[0]}` : 'Verse';
        }
        return tag.length > 10 ? tag.slice(0, 10) : tag;
      }

            mk('atvncg-06', 'Cơm Nhà', 'Liên minh Khải Hoàn', 'Chương 3: Nhỏ xíu'),

                { tag: 'Verse 1', singAlong: false, lines: [
                  { t: 'We drove all night just to stand right here', tr: 'Ta lái xe suốt đêm chỉ để đứng nơi đây' },
                  { t: 'Loud guitars ringing crystal clear', tr: 'Tiếng guitar vang dội thật trong trẻo' },
                ]},
                { tag: 'Chorus', singAlong: true, lines: [
                  { t: 'Whoa-oh, sing it back to the stage tonight', tr: 'Whoa-oh, hãy hát vọng lại lên sân khấu đêm nay' },

      // Home Search & Render
      $('home-search').addEventListener('input', (e) => {
        const q = e.target.value;
        $('home-search-clear').classList.toggle('hidden', !q);
        renderSuggestions($('home-suggest'), searchSongs(q, null), q, true);
      });
      $('home-search-clear').onclick = () => {
        $('home-search').value = '';
        $('home-search-clear').classList.add('hidden');
        $('home-suggest').classList.add('hidden');
      };

      function renderHome() {
        const container = $('setlist-list');
        if (!state.setlists.length) {
          container.innerHTML = `
            <div class="empty">
              <h2>Sẵn sàng cho đêm concert</h2>
              <p>Chạy 100% offline ở chế độ máy bay, mượt 60fps chuẩn Spotify trên iPhone OLED.</p>
              <div class="btn-stack">
                <button class="btn-primary" id="empty-atvncg">Nạp Setlist ATVNCG 2026</button>
                <button class="btn-secondary" id="empty-demo">Nạp Setlist Demo V-Pop &amp; US-UK</button>
              </div>
            </div>`;
          $('empty-atvncg').onclick = () => { saveSetlist(buildAtvncg2026Setlist()); renderHome(); showToast('Đã nạp Setlist ATVNCG 2026'); };
          $('empty-demo').onclick = () => { saveSetlist(buildDemoSetlist()); renderHome(); showToast('Đã nạp Setlist Demo'); };
          return;
        }

        container.innerHTML = '';
        state.setlists.forEach((sl) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-body">
              <div class="card-title"></div>
              <div class="card-sub"></div>
            </div>
            ${sl.songs.length ? '<button class="icon-btn gold" data-play>▶</button>' : ''}
            <button class="icon-btn danger" data-del>✕</button>`;
          card.querySelector('.card-title').textContent = sl.setlist || 'Setlist';
          card.querySelector('.card-sub').textContent = [sl.artist, `${sl.songs.length} bài hát`].filter(Boolean).join(' • ');
          card.querySelector('.card-body').onclick = () => openDetail(sl.id);
          const playBtn = card.querySelector('[data-play]');
          if (playBtn) playBtn.onclick = () => openConcert(sl, 0);
          card.querySelector('[data-del]').onclick = () => {
            if (confirm(`Xóa "${sl.setlist}" khỏi máy?`)) {
              deleteSetlist(sl.id);
              renderHome();
            }
          };
          container.appendChild(card);
        });
      }

      // Detail Screen (2-Column Music-App Grid + Predictive Search)
      function currentSetlist() {
        return state.setlists.find((s) => s.id === state.currentSetlistId);
      }

      function openDetail(id) {
        state.currentSetlistId = id;
        $('detail-search').value = '';
        $('detail-search-clear').classList.add('hidden');
        $('detail-suggest').classList.add('hidden');
        renderDetail();
        showScreen('screen-detail');
      }

      $('detail-search').addEventListener('input', (e) => {
        const q = e.target.value;
        $('detail-search-clear').classList.toggle('hidden', !q);
        const sl = currentSetlist();
        if (!sl) return;
        renderSuggestions($('detail-suggest'), searchSongs(q, sl), q, false);
        renderDetail(q);
      });
      $('detail-search-clear').onclick = () => {
        $('detail-search').value = '';
        $('detail-search-clear').classList.add('hidden');
        $('detail-suggest').classList.add('hidden');
        renderDetail('');
      };

      function renderDetail(filterQuery = '') {
        const sl = currentSetlist();
        if (!sl) { showScreen('screen-home'); renderHome(); return; }
        $('detail-title').textContent = sl.setlist || 'Setlist';
        $('detail-artist').textContent = [sl.artist, `${sl.songs.length} bài`].filter(Boolean).join(' • ');
        $('btn-start-concert').classList.toggle('hidden', !sl.songs.length);

        const list = $('song-list');
        if (!sl.songs.length) {
          list.className = '';
          list.innerHTML = '<div class="empty"><p>Chưa có bài hát nào. Bấm "+ Thêm bài" để dán lời.</p></div>';
          return;
        }

        const nq = normText(filterQuery);
        const items = sl.songs
          .map((song, idx) => ({ song, idx }))
          .filter(({ song }) => !nq || normText(song.title).includes(nq) || normText(song.artist || sl.artist || '').includes(nq));

        if (!items.length) {
          list.className = '';
          list.innerHTML = '<div class="empty"><p>Không có bài nào khớp từ khóa.</p></div>';
          return;
        }

        list.className = 'song-grid';
        list.innerHTML = '';
        items.forEach(({ song, idx }) => {
          const hasSing = (song.sections || []).some((s) => s.singAlong);
          const tile = document.createElement('div');
          tile.className = 'song-tile';
          tile.innerHTML = `
            <div class="tile-top">
              <span class="tile-num">${String(idx + 1).padStart(2, '0')}${hasSing ? '<span class="tile-gold-dot"></span>' : ''}</span>
              <button class="tile-more" data-more aria-label="Tùy chọn">⋯</button>
            </div>
            <div>
              <div class="tile-title"></div>
              <div class="tile-artist"></div>
            </div>`;
          tile.querySelector('.tile-title').textContent = song.title;
          tile.querySelector('.tile-artist').textContent = song.artist || sl.artist || `${(song.sections || []).length} đoạn`;
          tile.onclick = (e) => {
            if (e.target.closest('[data-more]')) return;
            openConcert(sl, idx);
          };
          tile.querySelector('[data-more]').onclick = (e) => {
            e.stopPropagation();
            openSongSheet(idx);
          };
          list.appendChild(tile);
        });
      }

      // Song Action Sheet
      function openSongSheet(idx) {
        const sl = currentSetlist();
        if (!sl || !sl.songs[idx]) return;
        state.sheetSongIndex = idx;
        $('sheet-song-title').textContent = sl.songs[idx].title;
        $('song-sheet').classList.add('open');
      }
      function closeSongSheet() {
        $('song-sheet').classList.remove('open');
      }
      $('song-sheet').onclick = (e) => { if (e.target === $('song-sheet')) closeSongSheet(); };
      $('sheet-play').onclick = () => {
        const sl = currentSetlist();
        closeSongSheet();
        if (sl) openConcert(sl, state.sheetSongIndex);
      };
      $('sheet-edit').onclick = () => {
        closeSongSheet();
        openEditor(state.sheetSongIndex);
      };
      $('sheet-up').onclick = () => {
        const sl = currentSetlist();
        const i = state.sheetSongIndex;
        closeSongSheet();
        if (!sl || i <= 0) return;
        const copy = sl.songs.slice();
        [copy[i - 1], copy[i]] = [copy[i], copy[i - 1]];
        saveSetlist({ ...sl, songs: copy });
        renderDetail($('detail-search').value);
      };
      $('sheet-down').onclick = () => {
        const sl = currentSetlist();
        const i = state.sheetSongIndex;
        closeSongSheet();
        if (!sl || i < 0 || i >= sl.songs.length - 1) return;
        const copy = sl.songs.slice();
        [copy[i], copy[i + 1]] = [copy[i + 1], copy[i]];
        saveSetlist({ ...sl, songs: copy });
        renderDetail($('detail-search').value);
      };
      $('sheet-delete').onclick = () => {
        const sl = currentSetlist();
        const i = state.sheetSongIndex;
        closeSongSheet();
        if (!sl || i < 0) return;
        const copy = sl.songs.slice();
        copy.splice(i, 1);
        saveSetlist({ ...sl, songs: copy });
        renderDetail($('detail-search').value);
      };

      // Quick Editor
      function openEditor(songIdx) {
        const sl = currentSetlist();
        if (!sl) return;
        state.editingSongIndex = songIdx;
        if (songIdx >= 0) {
          const s = sl.songs[songIdx];
          $('editor-heading').textContent = 'Sửa lời bài hát';
          $('ed-title').value = s.title || '';
          $('ed-artist').value = s.artist || '';
          $('ed-lyrics').value = songToEditableText(s);
        } else {
          $('editor-heading').textContent = 'Thêm bài hát mới';
          $('ed-title').value = '';
          $('ed-artist').value = '';
          $('ed-lyrics').value = '';
        }
        showScreen('screen-editor');
      }

      $('tag-chips').addEventListener('click', (e) => {
        const tag = e.target.getAttribute('data-tag');
        if (!tag) return;
        const ta = $('ed-lyrics');
        const prefix = ta.value && !ta.value.endsWith('\n') ? '\n\n' : '';
        ta.value += `${prefix}${tag}\n`;
        ta.focus();
      });

      $('btn-editor-cancel').onclick = () => showScreen('screen-detail');
      $('btn-editor-save').onclick = () => {
        const sl = currentSetlist();
        if (!sl) return;
        const title = $('ed-title').value.trim();
        const artist = $('ed-artist').value.trim();
        const raw = $('ed-lyrics').value;
        if (!title) { showToast('Vui lòng nhập tên bài hát'); return; }
        const parsed = parseLyricsText(raw, title, artist);
        const songs = sl.songs.slice();
        if (state.editingSongIndex >= 0) {
          parsed.id = songs[state.editingSongIndex].id || parsed.id;
          songs[state.editingSongIndex] = parsed;
        } else {
          songs.push(parsed);
        }
        saveSetlist({ ...sl, songs });
        renderDetail($('detail-search').value);
        showScreen('screen-detail');
        showToast('Đã lưu lời bài hát');
      };

      // CONCERT MODE: 60fps Custom Spring/EaseOutQuint Scroll + Spotify Depth Focus + Auto-Scroll
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen');
        } catch (_) {}
      }
      function releaseWakeLock() {
        if (state.wakeLock) {
          state.wakeLock.release().catch(() => {});
          state.wakeLock = null;
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && $('screen-concert').classList.contains('active')) {
          requestWakeLock();
        }
      });

      function cancelSmoothScroll() {
        if (state.scrollRaf) {
          cancelAnimationFrame(state.scrollRaf);
          state.scrollRaf = 0;
        }
      }

      function smoothScrollToLine(el) {
        if (!el) return;
        const scroller = $('lyrics-scroller');
        cancelSmoothScroll();
        const startY = scroller.scrollTop;
        // Position active line in the natural upper-third (32% from top) like Spotify/Apple Music
        const targetY = Math.max(0, el.offsetTop - scroller.clientHeight * 0.32);
        const diff = targetY - startY;
        if (Math.abs(diff) < 1) return;

        const duration = 420;
        const startTime = performance.now();
        const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);

        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          scroller.scrollTop = startY + diff * easeOutQuint(t);
          if (t < 1) {
            state.scrollRaf = requestAnimationFrame(step);
          } else {
            state.scrollRaf = 0;
          }
        };
        state.scrollRaf = requestAnimationFrame(step);
      }

      // Auto-Scroll (60fps rAF delta-time + syncs active Spotify focus line automatically)
      function updateAutoScrollBtn() {
        const btn = $('btn-autoscroll');
        btn.textContent = state.autoScrollOn ? '❚❚ Dừng' : '▶ Tự chạy';
        btn.classList.toggle('active-toggle', state.autoScrollOn);
      }

      function startAutoScroll() {
        if (state.autoScrollOn) return;
        cancelSmoothScroll();
        state.autoScrollOn = true;
        state.autoScrollLastTs = performance.now();
        updateAutoScrollBtn();

        const scroller = $('lyrics-scroller');
        const tick = (now) => {
          if (!state.autoScrollOn) return;
          const dt = Math.min(0.05, (now - state.autoScrollLastTs) / 1000);
          state.autoScrollLastTs = now;
          const speed = SPEEDS[state.speedIdx];
          const maxScroll = scroller.scrollHeight - scroller.clientHeight;
          if (scroller.scrollTop >= maxScroll - 1) {
            stopAutoScroll();
            return;
          }
          scroller.scrollTop += BASE_AUTOSCROLL_PX_PER_SEC * speed * dt;
          syncActiveLineFromScroll();
          state.autoScrollRaf = requestAnimationFrame(tick);
        };
        state.autoScrollRaf = requestAnimationFrame(tick);
      }

      function stopAutoScroll() {
        if (!state.autoScrollOn) return;
        state.autoScrollOn = false;
        if (state.autoScrollRaf) {
          cancelAnimationFrame(state.autoScrollRaf);
          state.autoScrollRaf = 0;
        }
        updateAutoScrollBtn();
      }

      function syncActiveLineFromScroll() {
        const scroller = $('lyrics-scroller');
        const focusY = scroller.scrollTop + scroller.clientHeight * 0.34;
        const els = state.lineEls;
        if (!els.length) return;
        let best = state.activeLineIdx;
        let bestDist = Infinity;
        for (let i = 0; i < els.length; i++) {
          const mid = els[i].offsetTop + els[i].offsetHeight * 0.5;
          const d = Math.abs(mid - focusY);
          if (d < bestDist) {
            bestDist = d;
            best = i;
          }
        }
        if (best !== state.activeLineIdx) {
          applyActiveLineClasses(best);
        }
      }

      function openConcert(setlist, songIdx) {
        if (!setlist.songs.length) return;
        stopAutoScroll();
        state.concertSetlist = setlist;
        state.concertSongIdx = Math.max(0, Math.min(songIdx, setlist.songs.length - 1));
        state.activeLineIdx = 0;
        renderConcertSong(0);
        showScreen('screen-concert');
        requestWakeLock();
      }

      function renderConcertSong(slideDir) {
        const sl = state.concertSetlist;
        const song = sl.songs[state.concertSongIdx];
        $('concert-song-title').textContent = song.title;
        $('concert-song-meta').textContent = `${state.concertSongIdx + 1} / ${sl.songs.length}${song.artist ? ' • ' + song.artist : ''}`;

        const pills = $('concert-pills');
        const track = $('lyrics-track');
        const scroller = $('lyrics-scroller');
        pills.innerHTML = '';
        track.innerHTML = '';
        track.classList.toggle('hide-tr', !state.showTr);

        const frag = document.createDocumentFragment();
        const lineEls = [];
        const sectionStarts = [];
        let flatIdx = 0;

        (song.sections || []).forEach((sec) => {
          sectionStarts.push(flatIdx);
          const pill = document.createElement('button');
          pill.className = 'pill' + (sec.singAlong ? ' sing' : '');
          pill.textContent = shortTag(sec.tag);
          const jumpTarget = flatIdx;
          pill.onclick = () => {
            stopAutoScroll();
            setActiveLine(jumpTarget, true);
          };
          pills.appendChild(pill);

          const hdr = document.createElement('div');
          hdr.className = 'section-header' + (sec.singAlong ? ' sing' : '');
          hdr.textContent = sec.tag;
          frag.appendChild(hdr);

          (sec.lines || []).forEach((line) => {
            const div = document.createElement('div');
            div.className = 'lyric-line' + (sec.singAlong ? ' sing' : '');
            const main = document.createElement('div');
            main.textContent = line.t;
            div.appendChild(main);
            if (line.tr) {
              const tr = document.createElement('div');
              tr.className = 'lyric-tr';
              tr.textContent = line.tr;
              div.appendChild(tr);
            }
            const targetIdx = flatIdx;
            div.onclick = (e) => {
              e.stopPropagation();
              stopAutoScroll();
              setActiveLine(targetIdx, true);
            };
            frag.appendChild(div);
            lineEls.push(div);
            flatIdx++;
          });
        });

        // Smooth GPU Slide + Fade when switching songs
        if (slideDir) {
          track.style.transition = 'none';
          track.style.opacity = '0';
          track.style.transform = `translate3d(${slideDir > 0 ? 28 : -28}px, 0, 0)`;
        }
        track.appendChild(frag);
        state.lineEls = lineEls;
        state.sectionStarts = sectionStarts;
        scroller.scrollTop = 0;
        applyActiveLineClasses(0);

        if (slideDir) {
          requestAnimationFrame(() => {
            track.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease';
            track.style.opacity = '1';
            track.style.transform = 'translate3d(0, 0, 0)';
          });
        }
      }

      function applyActiveLineClasses(idx) {
        const els = state.lineEls;
        if (!els.length) return;
        state.activeLineIdx = Math.max(0, Math.min(idx, els.length - 1));
        for (let i = 0; i < els.length; i++) {
          const el = els[i];
          el.classList.remove('is-active', 'is-next', 'is-past', 'is-far');
          if (i === state.activeLineIdx) el.classList.add('is-active');
          else if (i === state.activeLineIdx + 1) el.classList.add('is-next');
          else if (i < state.activeLineIdx) el.classList.add('is-past');
          else el.classList.add('is-far');
        }

        const starts = state.sectionStarts;
        let activeSec = 0;
        for (let i = 0; i < starts.length; i++) {
          if (state.activeLineIdx >= starts[i]) activeSec = i;
        }
        const pillEls = $('concert-pills').children;
        for (let i = 0; i < pillEls.length; i++) {
          pillEls[i].classList.toggle('current', i === activeSec);
        }
      }

      function setActiveLine(idx, shouldScroll) {
        applyActiveLineClasses(idx);
        if (shouldScroll && state.lineEls[state.activeLineIdx]) {
          smoothScrollToLine(state.lineEls[state.activeLineIdx]);
        }
      }

      // User manual scroll / swipe gestures
      const scrollerEl = $('lyrics-scroller');
      let touchStartX = 0;
      let touchStartY = 0;
      scrollerEl.addEventListener('touchstart', (e) => {
        cancelSmoothScroll();
        if (state.autoScrollOn) stopAutoScroll();
        if (e.touches && e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      scrollerEl.addEventListener('touchend', (e) => {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 72 && Math.abs(dx) > Math.abs(dy) * 1.6) {
          if (dx < 0) nextSong();
          else prevSong();
        }
      }, { passive: true });

      scrollerEl.addEventListener('wheel', () => {
        cancelSmoothScroll();
        if (state.autoScrollOn) stopAutoScroll();
      }, { passive: true });

      // Tap-to-Advance on empty area (bottom 72% = +1, top 28% = -1)
      scrollerEl.addEventListener('click', (e) => {
        if (e.target.closest('.lyric-line')) return;
        stopAutoScroll();
        const rect = scrollerEl.getBoundingClientRect();
        const relY = (e.clientY - rect.top) / rect.height;
        setActiveLine(state.activeLineIdx + (relY < 0.28 ? -1 : 1), true);
      });

      function prevSong() {
        if (!state.concertSetlist || state.concertSongIdx <= 0) return;
        stopAutoScroll();
        state.concertSongIdx--;
        state.activeLineIdx = 0;
        renderConcertSong(-1);
      }
      function nextSong() {
        if (!state.concertSetlist || state.concertSongIdx >= state.concertSetlist.songs.length - 1) return;
        stopAutoScroll();
        state.concertSongIdx++;
        state.activeLineIdx = 0;
        renderConcertSong(1);
      }

      $('btn-concert-back').onclick = () => {
        $('dim-slider').value = 0;
        $('dim-overlay').style.opacity = 0;
        $('dim-val').textContent = '0%';
        showScreen(state.currentSetlistId ? 'screen-detail' : 'screen-home');
      };
      $('btn-prev-song').onclick = prevSong;
      $('btn-next-song').onclick = nextSong;
      $('btn-toggle-hud').onclick = () => {
        state.hudVisible = !state.hudVisible;
        $('concert-bottom').classList.toggle('hidden', !state.hudVisible);
      };
      $('btn-autoscroll').onclick = () => {
        if (state.autoScrollOn) stopAutoScroll();
        else startAutoScroll();
      };
      $('btn-speed').onclick = () => {
        state.speedIdx = (state.speedIdx + 1) % SPEEDS.length;
        $('btn-speed').textContent = `${SPEEDS[state.speedIdx].toFixed(1)}x`;
      };
      $('dim-slider').oninput = (e) => {
        const val = Number(e.target.value);
        $('dim-overlay').style.opacity = (val / 100).toFixed(2);
        $('dim-val').textContent = `${val}%`;
      };
      // Zero-DOM-rebuild CSS var font resize & translation toggle (instant 60fps!)
      $('btn-font-dec').onclick = () => {
        state.fontSize = Math.max(16, state.fontSize - 2);
        document.documentElement.style.setProperty('--lyric-size', state.fontSize + 'px');
      };
      $('btn-font-inc').onclick = () => {
        state.fontSize = Math.min(34, state.fontSize + 2);
        document.documentElement.style.setProperty('--lyric-size', state.fontSize + 'px');
      };
      $('btn-toggle-tr').onclick = () => {
        state.showTr = !state.showTr;
        $('btn-toggle-tr').textContent = state.showTr ? 'Dịch: Bật' : 'Dịch: Tắt';
        $('lyrics-track').classList.toggle('hide-tr', !state.showTr);
      };
      $('btn-step-prev').onclick = () => { stopAutoScroll(); setActiveLine(state.activeLineIdx - 1, true); };
      $('btn-step-next').onclick = () => { stopAutoScroll(); setActiveLine(state.activeLineIdx + 1, true); };

      // Home & Detail Buttons
      $('btn-detail-back').onclick = () => { showScreen('screen-home'); renderHome(); };
      $('btn-start-concert').onclick = () => { const sl = currentSetlist(); if (sl) openConcert(sl, 0); };
      $('btn-add-song').onclick = () => openEditor(-1);
      $('btn-new-setlist').onclick = () => {
        const title = prompt('Tên Concert / Setlist mới:', 'Concert 2026');
        if (!title || !title.trim()) return;
        const artist = prompt('Nghệ sĩ (tùy chọn):', '') || '';
        const sl = { v: 1, id: 'setlist-' + Date.now().toString(36), setlist: title.trim(), artist: artist.trim(), songs: [] };
        saveSetlist(sl);
        openDetail(sl.id);
      };
      $('btn-seed-atvncg').onclick = () => {
        saveSetlist(buildAtvncg2026Setlist());
        renderHome();
        showToast('Đã nạp Setlist ATVNCG 2026');
      };
      $('btn-export').onclick = () => {
        const sl = currentSetlist();
        if (!sl) return;
        const blob = new Blob([JSON.stringify(sl, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const slug = (sl.setlist || 'stageline').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'stageline';
        a.href = url;
        a.download = `${slug}.concert`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`Đã xuất ${slug}.concert`);
      };

      $('btn-import').onclick = () => $('file-input').click();
      $('file-input').onchange = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        try {
          const text = await file.text();
          const name = file.name.toLowerCase();
          if (name.endsWith('.concert') || name.endsWith('.json')) {
            const parsed = JSON.parse(text.replace(/^\uFEFF/, ''));
            if (!parsed || parsed.v !== 1 || !Array.isArray(parsed.songs)) {
              throw new Error('Tệp .concert không đúng định dạng StageLine v1');
            }
            saveSetlist(parsed);
            renderHome();
            showToast(`Đã nhập "${parsed.setlist}" (${parsed.songs.length} bài)`);
          } else if (name.endsWith('.lrc') || name.endsWith('.txt')) {
            const stem = file.name.replace(/\.[^.]+$/, '');
            const song = parseLyricsText(text, stem, '');
            const sl = { v: 1, id: 'imp-' + Date.now().toString(36), setlist: song.title, artist: song.artist || '', songs: [song] };
            saveSetlist(sl);
            renderHome();
            showToast(`Đã nhập bài "${song.title}"`);
          } else {
            throw new Error('Chỉ hỗ trợ .concert, .json, .lrc hoặc .txt');
          }
        } catch (err) {
          showToast('Lỗi nhập tệp: ' + (err.message || err));
        }
      };

      // Init
      loadSetlists();
      renderHome();
    })();
  </script>
</body>
</html>
