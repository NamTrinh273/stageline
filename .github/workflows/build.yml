name: Build StageLine (Android & iOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-release:
    name: Android Release APK (arm64-v8a < 18 MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build slim release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify arm64-v8a APK size budget (< 18 MB)
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          MAX_BYTES=18874368
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
          echo "app-arm64-v8a-release.apk size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "::error::APK size ${SIZE_MB} MB (${SIZE_BYTES} bytes) meets or exceeds 18 MB (${MAX_BYTES} bytes) budget!"
            exit 1
          fi

      - name: Upload Android arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: stageline-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  ios-unsigned-ipa:
    name: iOS Unsigned IPA (No-Codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package StageLine-unsigned.ipa
        run: |
          rm -rf Payload StageLine-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r -y StageLine-unsigned.ipa Payload
          ls -lh StageLine-unsigned.ipa

      - name: Upload iOS unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: stageline-ios-unsigned-ipa
          path: StageLine-unsigned.ipa
          if-no-files-found: error
